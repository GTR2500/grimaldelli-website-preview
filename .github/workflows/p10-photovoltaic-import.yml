name: P10 - Recupero archivio Fotovoltaico Grimaldelli
on:
  push:
    branches: [dev/p10-energy-biogas-photovoltaico-20261113]
    paths:
      - scripts/p10_acquire_photovoltaic_archive.py
      - .github/workflows/p10-photovoltaic-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4 Pillow
      - name: Download corporate photovoltaic project photographs
        run: python scripts/p10_acquire_photovoltaic_archive.py
      - name: Verify photographs and documentation
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('assets/energy/photovoltaic/manifest.json').read_text())
          assert len(d['projects'])>=2
          for project in d['projects']:
            for img in project['images']:
              file=pathlib.Path(img['path'])
              assert file.is_file() and file.stat().st_size>14000
          print('PHOTOVOLTAIC_PROJECTS',len(d['projects']))
          PY
      - name: Save original-derived assets in Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/energy/photovoltaic
          if ! git diff --cached --quiet; then
            git commit -m "P10: importa foto progetti fotovoltaici archivio storico"
            git push origin HEAD:dev/p10-energy-biogas-photovoltaico-20261113
          fi
